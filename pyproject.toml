[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-cdr-gen"
version = "0.1.0"
description = "Constraint-aware CDR sequence generation via guided Gibbs sampling with Metropolis-Hastings correction. Evaluated by an INDEPENDENT developability oracle, not by the sampler's own surrogate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Di Wu" }]
keywords = ["antibody", "cdr", "generative", "sampling", "developability", "biologics"]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "transformers>=4.30",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.32",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cdr_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "real_esm: needs network + ~500 MB ESM-2 download",
]

[tool.ruff]
line-length = 100
target-version = "py310"
